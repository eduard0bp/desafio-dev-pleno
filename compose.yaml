services:
  mock-analysis-api:
    build:
      context: ./mock-analysis-api
    container_name: desafio-mock-analysis-api
    restart: unless-stopped
    ports:
      - "${MOCK_API_PORT:-4000}:4000"
    environment:
      PORT: 4000
      MIN_DELAY_MS: ${MIN_DELAY_MS:-250}
      MAX_DELAY_MS: ${MAX_DELAY_MS:-900}
      FAIL_EVERY_N: ${FAIL_EVERY_N:-5}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-10000}
      RETRY_AFTER_SECONDS: ${RETRY_AFTER_SECONDS:-2}
      SLOW_EXTRA_DELAY_MS: ${SLOW_EXTRA_DELAY_MS:-2500}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-before-sharing}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  postgres:
    image: postgres:16-alpine
    container_name: desafio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-falae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falae}
      POSTGRES_DB: ${POSTGRES_DB:-falae}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-falae}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  redis:
    image: redis:7-alpine
    container_name: desafio-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend-api:
    build:
      context: ./backend
    container_name: desafio-backend-api
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-falae}:${POSTGRES_PASSWORD:-falae}@postgres:5432/${POSTGRES_DB:-falae}?schema=public
      REDIS_URL: redis://redis:6379
      MOCK_ANALYSIS_API_URL: http://mock-analysis-api:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-analysis-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend-worker:
    build:
      context: ./backend
    container_name: desafio-backend-worker
    restart: unless-stopped
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falae}:${POSTGRES_PASSWORD:-falae}@postgres:5432/${POSTGRES_DB:-falae}?schema=public
      REDIS_URL: redis://redis:6379
      MOCK_ANALYSIS_API_URL: http://mock-analysis-api:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-analysis-api:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
    container_name: desafio-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend-api

volumes:
  postgres-data:
